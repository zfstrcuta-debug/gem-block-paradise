// ---------- 难度分档 ----------
// L1-4: 6×6 练习无收集；L5-10: 8×8 每种20颗；L11-20: 10×10+障碍 每种30颗；L21+: 加难
function tierOf(n) {
  if (n <= 4) return 0;
  if (n <= 10) return 1;
  if (n <= 20) return 2;
  return 3;
}
function activeSizeOf(n) {
  const t = tierOf(n);
  return t === 0 ? 6 : t === 1 ? 8 : 10;
}
function levelTarget(n) {
  const t = tierOf(n);
  if (t === 0) return 40 + n * 10;            // L1-4: 50/60/70/80（6×6 练习降门槛）
  if (t === 1) return 200 + (n - 5) * 60;     // L5-10: 200~500
  if (t === 2) return 560 + (n - 11) * 80;    // L11-20: 560~1280
  return 1320 + (n - 21) * 100;               // L21+: 持续加难
}
function obstacleCountOf(n) {
  const t = tierOf(n);
  if (t <= 1) return t === 1 ? 2 : 0;         // L5-10 少量 2 块
  if (t === 2) return 3 + Math.floor((n - 11) / 3); // L11-20: 3~6 块
  return 7 + Math.floor((n - 21) / 3);        // L21+: 7 块起递增
}
// 开放区（居中）：返回 {s:起始格, size:边长, e:结束格(不含)}
function regionOf(size) {
  const s = Math.floor((N - size) / 2);
  return { s: s, size: size, e: s + size };
}
function inRegion(x, y, reg) {
  return x >= reg.s && x < reg.e && y >= reg.s && y < reg.e;
}

// ---------- 关卡收集目标 ----------
// L1-4 无收集；L5-10 抽2-3种每种20颗；L11+ 抽4-6种每种30颗
function makeGoal(n) {
  const t = tierOf(n);
  if (t === 0) return null;
  const kinds = t === 1 ? 2 + Math.floor(Math.random() * 2)   // 2~3
                        : 4 + Math.floor(Math.random() * 3);  // 4~6
  const need = t === 1 ? 20 : 30;
  const pool = shuffleArr([0, 1, 2, 3, 4, 5]);
  const goal = {};
  for (let i = 0; i < kinds; i++) goal[pool[i]] = { need: need, got: 0 };
  return goal;
}
function goalComplete() {
  if (!S.goal) return true;
  for (const k in S.goal) if (S.goal[k].got < S.goal[k].need) return false;
  return true;
}
function cloneGoal(src) {
  const g = {};
  for (const k in src) g[k] = { need: src[k].need, got: src[k].got };
  return g;
}
function resetGoalProgress(src) {
  if (!src) return null;
  const g = {};
  for (const k in src) g[k] = { need: src[k].need, got: 0 };
  return g;
}

// ---------- 玩法逻辑 ----------
function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function shapeW(shape) { return Math.max.apply(null, shape.map(c => c[0])) + 1; }
function shapeH(shape) { return Math.max.apply(null, shape.map(c => c[1])) + 1; }
// 每格自带颜色：闯关=同一块上 2~3 种不同宝石；无尽=整块单色普通方块
// 候选池先过滤：宽高不超开放区；L1-4 练习区再限 ≤4 格（排除 1×5 / 3×3 / 闪电阶梯）
function eligibleShapes() {
  const maxCells = (S.mode === 'level' && tierOf(S.level) === 0) ? 4 : 99;
  return SHAPES.filter(s => shapeW(s) <= S.active && shapeH(s) <= S.active && s.length <= maxCells);
}
function randPiece() {
  const pool = eligibleShapes();
  const shape = pool[Math.floor(Math.random() * pool.length)] || SHAPES[0];
  const k = shape.length;
  let cis;
  if (S.mode === 'level') {
    const kinds = Math.min(k, 2 + Math.floor(Math.random() * 2)); // 2 或 3 种；单格块 1 种
    const gemPool = shuffleArr([0, 1, 2, 3, 4, 5]).slice(0, kinds);
    cis = [];
    for (let i = 0; i < k; i++) cis.push(gemPool[i % kinds]);
    shuffleArr(cis);
  } else {
    const ci = Math.floor(Math.random() * COLORS.length);
    cis = shape.map(() => ci);
  }
  return { cells: shape.map((c, i) => [c[0], c[1], cis[i]]), used: false };
}
function cellCI(p, c) {
  if (c.length >= 3 && c[2] >= 0 && c[2] < COLORS.length) return c[2];
  return Math.max(0, COLORS.indexOf(p.color)); // 兼容旧存档
}
function canPlace(cells, x0, y0) {
  for (const c of cells) {
    const x = x0 + c[0], y = y0 + c[1];
    if (!inRegion(x, y, S.reg)) return false;
    if (S.board[y][x] !== EMPTY) return false;
  }
  return true;
}
function checkOver() {
  for (const p of S.pieces) {
    if (p.used) continue;
    for (let y = S.reg.s; y < S.reg.e; y++) for (let x = S.reg.s; x < S.reg.e; x++) {
      if (canPlace(p.cells, x, y)) return false;
    }
  }
  return true;
}
function spawn() {
  S.pieces = [randPiece(), randPiece(), randPiece()];
  S.over = checkOver();
  if (S.over) S.msg = '游戏结束！';
}
// 满行/满列只在开放区内判定；锁区不可消除；收集目标宝石给额外积分
function clearLines() {
  const reg = S.reg, rows = [], cols = [];
  for (let y = reg.s; y < reg.e; y++) {
    let full = true;
    for (let x = reg.s; x < reg.e; x++) if (S.board[y][x] < 0) { full = false; break; }
    if (full) rows.push(y);
  }
  for (let x = reg.s; x < reg.e; x++) {
    let full = true;
    for (let y = reg.s; y < reg.e; y++) if (S.board[y][x] < 0) { full = false; break; }
    if (full) cols.push(x);
  }

  let collected = 0;
  if (S.mode === 'level' && S.goal) {
    const seen = {};
    const mark = (x, y) => {
      const key = y * N + x;
      if (seen[key]) return;
      seen[key] = 1;
      const v = S.board[y][x];
      if (v >= 0 && S.goal[v]) {
        S.goal[v].got = Math.min(S.goal[v].need, S.goal[v].got + 1);
        collected++;
      }
    };
    for (const y of rows) for (let x = reg.s; x < reg.e; x++) mark(x, y);
    for (const x of cols) for (let y = reg.s; y < reg.e; y++) mark(x, y);
  }

  for (const y of rows) for (let x = reg.s; x < reg.e; x++) S.board[y][x] = EMPTY;
  for (const x of cols) for (let y = reg.s; y < reg.e; y++) S.board[y][x] = EMPTY;
  const n = rows.length + cols.length;
  if (n) {
    S.score += n * 10 + collected * COLLECT_BONUS;
    S.msg = collected > 0
      ? '消除 ' + n + ' 条！收集 ' + collected + ' 颗 +' + (collected * COLLECT_BONUS) + ' 分'
      : '漂亮！消除 ' + n + ' 条！';
  }
}
// 开局预置方块：在开放区内摆随机形状组合、带宝石色、可被正常消除
function placeObstacles(count) {
  const reg = S.reg, budget = count * 3;
  let used = 0, placed = 0, guard = 0;
  while (placed < count && used < budget && guard++ < 800) {
    const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
    if (shapeW(shape) > reg.size || shapeH(shape) > reg.size) continue;
    if (used + shape.length > budget) continue;
    const ox = reg.s + Math.floor(Math.random() * (reg.size - shapeW(shape) + 1));
    const oy = reg.s + Math.floor(Math.random() * (reg.size - shapeH(shape) + 1));
    if (!canPlace(shape, ox, oy)) continue;
    const kinds = Math.min(shape.length, 2 + Math.floor(Math.random() * 2));
    const pool = shuffleArr([0, 1, 2, 3, 4, 5]).slice(0, kinds);
    for (let i = 0; i < shape.length; i++) {
      S.board[oy + shape[i][1]][ox + shape[i][0]] = pool[i % kinds];
    }
    used += shape.length;
    placed++;
  }
}
// 快照不含 items（防还原刷道具）；收集进度深拷贝（防还原丢进度）
function saveSnap() {
  S.snap = {
    board: S.board.map(r => r.slice()),
    pieces: S.pieces.map(p => ({ cells: p.cells.map(c => c.slice()), color: p.color, used: p.used })),
    score: S.score, over: S.over, msg: S.msg,
    goal: S.goal ? cloneGoal(S.goal) : null
  };
}
function restoreSnap() {
  if (!S.snap) return false;
  const s = S.snap;
  S.board = s.board; S.pieces = s.pieces;
  S.score = s.score; S.over = s.over; S.msg = s.msg;
  if (s.goal) S.goal = cloneGoal(s.goal);
  S.snap = null;
  return true;
}
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function grantItems() {
  S.items = [0, 0, 0];
  S.snap = null;
  S.items[Math.floor(Math.random() * 3)] = 1;
  const t = today();
  if (S.lastDaily !== t) {
    S.lastDaily = t;
    try { wx.setStorageSync('lastDaily', t); } catch (e) { /* 忽略 */ }
    S.items[Math.floor(Math.random() * 3)] += 1;
    S.msg = '每日奖励！额外获得 1 个道具～';
  }
}
function startEndless() {
  S.mode = 'endless'; S.scene = 'play'; S.level = 0; S.target = 0;
  S.goal = null;
  S.active = 10; S.reg = regionOf(10);
  S.board = Array.from({ length: N }, () => Array(N).fill(EMPTY));
  S.score = 0; S.drag = -1; S.over = false; S.result = ''; S.pendingAd = null;
  S.adUsed = 0; // 每局重置广告次数
  S.msg = '拖动方块，尽量拿高分！';
  grantItems(); spawn();
}
function startLevel(n) {
  S.mode = 'level'; S.scene = 'play'; S.level = n;
  S.target = levelTarget(n);
  S.goal = makeGoal(n);
  S.active = activeSizeOf(n); S.reg = regionOf(S.active);
  S.board = Array.from({ length: N }, () => Array(N).fill(LOCKED));
  for (let y = S.reg.s; y < S.reg.e; y++) for (let x = S.reg.s; x < S.reg.e; x++) S.board[y][x] = EMPTY;
  placeObstacles(obstacleCountOf(n));
  S.score = 0; S.drag = -1; S.over = false; S.result = ''; S.pendingAd = null;
  const t = tierOf(n);
  if (t === 0) S.msg = '初级练习：填满行或列拿分！';
  else if (t === 1) S.msg = '收集 ' + Object.keys(S.goal).length + ' 种宝石，达成分数线过关！';
  else S.msg = '收集 + 消除，突破分数线过关！';
  grantItems(); spawn();
}
function toMenu() {
  S.scene = 'menu'; S.drag = -1; S.pendingAd = null; S.over = false; S.result = '';
}
function place(idx, x0, y0) {
  const p = S.pieces[idx];
  if (!canPlace(p.cells, x0, y0)) { S.msg = '这里放不下，再试一次！'; return; }
  saveSnap();
  for (const c of p.cells) S.board[y0 + c[1]][x0 + c[0]] = cellCI(p, c);
  S.score += p.cells.length;
  p.used = true;
  clearLines();
  saveBest();
  // 通关双条件：分数线 + 收集进度
  if (S.mode === 'level' && S.score >= S.target && goalComplete()) { doWin(); return; }
  if (S.pieces.every(q => q.used)) spawn();
  else S.over = checkOver();
  if (S.over) doLose();
  else if (S.msg.indexOf('消除') < 0) S.msg = '太棒了！继续加油！';
}
// 当前正在收集的图样索引 = 已合成数量
function currentBeadIdx() {
  let n = 0;
  for (let i = 0; i < BEAD_TOTAL; i++) if (S.beadDone[i]) n++;
  return n;
}
function beadPerLevel(n) {
  const t = tierOf(n);
  return t === 0 ? 5 : t === 1 ? 10 : 15;   // L1-4:+5 L5-10:+10 L11+:+15
}
// 首通过关发拼豆：按难度给豆，攒满 100 自动合成当前图样
function grantBeads(n) {
  if (currentBeadIdx() >= BEAD_TOTAL) return;  // 全部图样已集齐
  const add = beadPerLevel(n);
  S.beadGot += add;
  const doneIdx = currentBeadIdx();
  const doneName = BEADS[doneIdx] ? BEADS[doneIdx].name : '';
  if (S.beadGot >= BEAD_NEED) {
    S.beadGot -= BEAD_NEED;
    S.beadDone[doneIdx] = true;
    try {
      wx.setStorageSync('beadGot', S.beadGot);
      wx.setStorageSync('beadDone', S.beadDone);
    } catch (e) { /* 忽略 */ }
    S.items[0] += 1; S.items[1] += 1; S.items[2] += 1;  // 合成奖励：道具 ×3
    const pageDone = (doneIdx + 1) % BEAD_PAGES[0].patterns.length === 0; // 每 8 个成一整篇
    if (pageDone) {
      for (let i = 0; i < 5; i++) S.items[i % 3] += 1;   // 集齐一篇额外道具 ×5
      S.msg = '合成「' + doneName + '」！' + BEAD_PAGES[BEADS[doneIdx].page].name + '篇集齐，道具 ×8！';
    } else {
      S.msg = '合成「' + doneName + '」！道具 ×3，继续收集下一图样～';
    }
  } else {
    try { wx.setStorageSync('beadGot', S.beadGot); } catch (e) { /* 忽略 */ }
    S.msg = '过关！拼豆 +' + add + '（' + S.beadGot + '/' + BEAD_NEED + '）';
  }
}
function doWin() {
  S.result = 'win'; S.over = false; S.drag = -1;
  const key = 'L' + S.level;
  if (!S.cleared[key]) { // 首通奖励
    S.cleared[key] = true;
    saveCleared();
    S.items[Math.floor(Math.random() * 3)] += 1;
    grantBeads(S.level);
  } else S.msg = '过关！';
}
function doLose() {
  S.result = 'lose'; S.over = true; S.drag = -1; S.msg = '游戏结束！';
  if (S.mode === 'endless') uploadScore(); // 死局也上传最终分数
}
// 无尽模式看广告复活：清掉一半已占格，分数不清，继续本局
function reviveHalf() {
  const cells = [];
  for (let y = S.reg.s; y < S.reg.e; y++) for (let x = S.reg.s; x < S.reg.e; x++) {
    if (S.board[y][x] !== EMPTY) cells.push([x, y]);
  }
  cells.sort((a, b) => {
    const open = (p) => {
      let n = 0;
      if (p[1] > S.reg.s && S.board[p[1] - 1][p[0]] === EMPTY) n++;
      if (p[1] < S.reg.e - 1 && S.board[p[1] + 1][p[0]] === EMPTY) n++;
      if (p[0] > S.reg.s && S.board[p[1]][p[0] - 1] === EMPTY) n++;
      if (p[0] < S.reg.e - 1 && S.board[p[1]][p[0] + 1] === EMPTY) n++;
      return n;
    };
    return open(b) - open(a);
  });
  const half = Math.ceil(cells.length / 2);
  for (let i = 0; i < half; i++) S.board[cells[i][1]][cells[i][0]] = EMPTY;
  S.over = checkOver();
  if (S.over) spawn();
  S.result = ''; S.over = false; S.drag = -1; S.pendingAd = null;
  S.msg = '复活成功！清掉半盘，继续努力～';
}
// 看广告降目标：×0.8（有下限），重开本关；目标宝石种类保留、进度清零
function reduceTargetAndRetry() {
  const floor = Math.floor(levelTarget(S.level) * 0.5);
  const newTarget = Math.max(floor, Math.floor(S.target * 0.8));
  const keptGoal = S.goal;
  startLevel(S.level);
  S.target = newTarget;
  S.goal = resetGoalProgress(keptGoal);
  S.msg = '目标已降低至 ' + S.target + ' 分！';
}
// 重试本关：保留已降低的目标与目标宝石，避免玩家「广告白看」
function retryLevel() {
  const kept = S.target, keptGoal = S.goal;
  startLevel(S.level);
  S.target = kept;
  S.goal = resetGoalProgress(keptGoal);
}
// 大槌子：敲开放区里周围空格最多的已填格，分数不变
function hammerBest() {
  let bx = -1, by = -1, bestOpen = -1;
  for (let y = S.reg.s; y < S.reg.e; y++) for (let x = S.reg.s; x < S.reg.e; x++) {
    if (S.board[y][x] === EMPTY) continue;
    let open = 0;
    if (y > S.reg.s && S.board[y - 1][x] === EMPTY) open++;
    if (y < S.reg.e - 1 && S.board[y + 1][x] === EMPTY) open++;
    if (x > S.reg.s && S.board[y][x - 1] === EMPTY) open++;
    if (x < S.reg.e - 1 && S.board[y][x + 1] === EMPTY) open++;
    if (open > bestOpen) { bestOpen = open; bx = x; by = y; }
  }
  return { x: bx, y: by };
}
function refreshPieces() {
  for (let i = 0; i < S.pieces.length; i++) if (!S.pieces[i].used) S.pieces[i] = randPiece();
  S.over = checkOver();
  if (S.over) doLose();
}
function useItem(i) {
  if (S.result || S.over) return;
  if (S.items[i] <= 0) {
    requestAd({ type: 'item', item: i }); // 模拟广告 TODO: 有流量主后接真 SDK
    return;
  }
  if (i === I_UNDO) {
    if (!S.snap) { S.msg = '还没有可以还原的步骤'; draw(); return; }
    S.items[i] -= 1; restoreSnap(); S.msg = '已还原上一手～';
  } else if (i === I_HAMMER) {
    const t = hammerBest();
    if (t.x < 0) { S.msg = '棋盘上没有可敲的方块'; draw(); return; }
    saveSnap(); S.items[i] -= 1; S.board[t.y][t.x] = EMPTY; S.msg = '大槌子敲掉一格！';
  } else if (i === I_REFRESH) {
    if (S.pieces.every(p => p.used)) { S.msg = '没有可刷新的方块'; draw(); return; }
    saveSnap(); S.items[i] -= 1; refreshPieces();
    if (!S.over) S.msg = '方块已刷新！';
  }
  draw();
}

// ---------- 绘制基础 ----------
// tracking>0 时逐字绘制并加字距（标题用），num 用数字字体（分数用）
function text(s, x, y, size, color, weight, tracking, num) {
  ctx.fillStyle = color;
  const fam = num ? FONT.num : FONT.family;
  const font = (weight ? weight + ' ' : '') + size + 'px ' + fam;
  ctx.font = font;
  if (tracking) {
    let cx = x;
    for (const ch of String(s)) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + tracking; }
  } else ctx.fillText(String(s), x, y);
}

  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);

// mode: 'full' 全彩 | 'progress' 按 lit 点亮 | 'locked' 全灰剪影
function drawBeadPattern(bp, x, y, size, lit, mode) {
  const step = size / 10;
  const total = bp.cells.length;
  const show = mode === 'full' ? total : mode === 'locked' ? 0 : Math.floor((lit / BEAD_NEED) * total);
  const grey = UI.outline;
  for (let i = 0; i < total; i++) {
    const cell = bp.cells[i];
    const bx = x + cell.x * step, by = y + cell.y * step;
    if (i < show) {
      drawBead(cell.ci, bx, by, step + 0.6);
    } else {
      // 未点亮：淡灰小圆点，保留图样轮廓
      ctx.fillStyle = mode === 'locked' ? '#EFEDE7' : grey;
      ctx.beginPath();
      ctx.arc(bx + step / 2, by + step / 2, step * 0.30, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function piece(p, cx, cy, unit) {
  let minX = 99, maxX = -99, minY = 99, maxY = -99;
  for (const c of p.cells) {
    minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]);
    minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]);
  }
  const sx = cx - (maxX - minX + 1) * unit / 2;
  const sy = cy - (maxY - minY + 1) * unit / 2;
  for (const c of p.cells) drawCellOf(p, c, sx + (c[0] - minX) * unit + 1, sy + (c[1] - minY) * unit + 1, unit - 2);
}
function snapOrigin(p, pos) {
  let minX = 99, maxX = -99, minY = 99, maxY = -99;
  for (const c of p.cells) {
    minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]);
    minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]);
  }
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const fx = (pos.x - BX) / (CELL + GAP), fy = (pos.y - BY) / (CELL + GAP);
  return {
    x: Math.round(fx - (w - 1) / 2) - minX,
    y: Math.round(fy - (h - 1) / 2) - minY
  };
}
function inBoard(pos) {
  return pos.y >= BY - 20 && pos.y < BY + N * (CELL + GAP) + 10 &&
         pos.x >= BX - 20 && pos.x < BX + N * (CELL + GAP) + 10;

  for (const c of p.cells) {

    if (px < BX || py < BY || px >= BX + N * (CELL + GAP) || py >= BY + N * (CELL + GAP)) continue;

    const bw = 320, bx = 152, by = 680;
    ctx.fillStyle = UI.surfaceLow; roundRectPath(ctx, bx, by, bw, 10, 5); ctx.fill();
    ctx.fillStyle = UI.primary;
    const pw = Math.max(4, Math.floor(bw * S.beadGot / BEAD_NEED));
    roundRectPath(ctx, bx, by, pw, 10, 5); ctx.fill();
    text(S.beadGot + ' / ' + BEAD_NEED, bx + bw + 8, by + 9, 13, UI.onSurfaceVar, '', 0, true);
  } else {
    text('✦ 全部图样已集齐！', 160, 660, 20, UI.primary, '600');

  text('已合成 ' + idx + ' / ' + BEAD_TOTAL + '　·　无尽最高分 ' + S.bestEndless, 34, 748, 14, UI.hint);
}
// 拼豆图鉴：八篇分页，每页 8 个图样
function drawAlbum() {
  drawBackdrop();
  text('拼豆图鉴', 32, 60, 26, UI.onSurface, '600', 1.2);
  const idx = currentBeadIdx();
  text('已合成 ' + idx + ' / ' + BEAD_TOTAL, 320, 60, 15, UI.onSurfaceVar, '', 0, true);

  // 八篇分页标签（4 列 × 2 行）
  for (let p = 0; p < BEAD_PAGES.length; p++) {
    const tx = ALBUM_TAB.x0 + (p % ALBUM_TAB.cols) * (ALBUM_TAB.w + ALBUM_TAB.gap);
    const ty = ALBUM_TAB.y0 + Math.floor(p / ALBUM_TAB.cols) * (ALBUM_TAB.h + ALBUM_TAB.gap);
    const activeTab = p === S.albumPage;
    button(tx, ty, ALBUM_TAB.w, ALBUM_TAB.h, activeTab ? 'filled' : 'outlined', BEAD_PAGES[p].name, 15);
  }

  // 当前篇的 8 个图样（2 列 × 4 行）
  const page = S.albumPage;
  const startIdx = page * 8;
  const cardW = 232, cardH = 132, cgapX = 16, cgapY = 12;
  const gx = 28, gy = 194;
  for (let s = 0; s < 8; s++) {
    const bi = startIdx + s;
    if (bi >= BEAD_TOTAL) break;
    const bp = BEADS[bi];
    const cx = gx + (s % 2) * (cardW + cgapX);
    const cy = gy + Math.floor(s / 2) * (cardH + cgapY);
    const done = !!S.beadDone[bi];
    const cur = bi === idx;
    panel(cx, cy, cardW, cardH, UI.surface, cur ? UI.primary : UI.outline);
    // 图样预览
    drawBeadPattern(bp, cx + 14, cy + 20, 104, S.beadGot, done ? 'full' : cur ? 'progress' : 'locked');
    // 名称与状态
    text(bp.name, cx + 132, cy + 46, 19, done || cur ? UI.onSurface : UI.itemOffText, '600');
    if (done) {
      text('✓ 已合成', cx + 132, cy + 78, 14, UI.success, '600');
    } else if (cur) {
      text('收集中 ' + S.beadGot + '/' + BEAD_NEED, cx + 132, cy + 78, 14, UI.primary, '', 0, true);
    } else {
      text('未解锁', cx + 132, cy + 78, 14, UI.itemOffText);
    }
  }
  button(160, 800, 220, 48, 'outlined', '返回', 17);
}
function drawRank() {

  panel(28, 100, 484, 630, UI.surface, UI.outline);

}
function drawGoalBar() {
  if (S.mode !== 'level' || !S.goal) return;
  const keys = Object.keys(S.goal).map(Number).sort((a, b) => a - b);
  if (!keys.length) return;
  const unit = keys.length >= 6 ? 82 : keys.length >= 4 ? 100 : 130;
  let x = (DW - unit * keys.length) / 2 + 6;
  for (const k of keys) {
    const g = S.goal[k], done = g.got >= g.need;
    ctx.globalAlpha = done ? 1 : 0.42;
    drawGem(k, x, 164, 22);
    ctx.globalAlpha = 1;
    text(g.got + '/' + g.need, x + 2, 201, 13, done ? UI.primary : UI.onSurfaceVar, done ? '600' : '');
    x += unit;
  }
}
function drawHUD() {
  drawBackdrop();
  text('宝石方块乐园', 32, 50, 21, UI.onSurface, '600', 1.2);
  const lvText = S.mode === 'level'
    ? '第 ' + S.level + ' 关 · ' + S.active + '×' + S.active + ' 区'
    : '无尽模式';
  text(lvText, 34, 82, 14, UI.onSurfaceVar);
  navButton('retry', 442, 18);
  navButton('home', 490, 18);
  ctx.strokeStyle = UI.outline; ctx.lineWidth = 1;

  text('分数', 34, 132, 14, UI.onSurfaceVar);
  text('' + S.score, 80, 134, 22, UI.onSurface, '600', 0, true);
  const best = S.mode === 'level' ? S.bestLevel : S.bestEndless;
  text('最高 ' + best, 190, 133, 14, UI.onSurfaceVar, '', 0, true);
  if (S.mode === 'level') text('分数线 ' + S.target, 380, 133, 14, UI.primary, '600', 0, true);

  drawGoalBar();
  if (S.mode === 'endless') text('广告 ' + S.adUsed + '/' + S.adLimit, 34, 199, 13, UI.onSurfaceVar);
  ctx.strokeStyle = UI.outline; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(32, 214); ctx.lineTo(508, 214); ctx.stroke();
}
function drawWin() {
  ctx.fillStyle = UI.overlay; ctx.fillRect(0, 0, DW, DH);
  panel(45, 330, 450, 290, UI.surface, UI.outline);
  text('过 关', 60, 396, 34, UI.onSurface, '600');
  text('第 ' + S.level + ' 关完成', 60, 436, 17, UI.onSurfaceVar);

}
function drawLose() {
  ctx.fillStyle = UI.overlay; ctx.fillRect(0, 0, DW, DH);
  panel(35, 315, 470, 315, UI.surface, UI.outline);
  text('游戏结束', 60, 380, 32, UI.onSurface, '600');

function drawAdDialog() {
  if (!S.pendingAd) return;
  ctx.fillStyle = UI.overlay; ctx.fillRect(0, 0, DW, DH);
  panel(50, 350, 440, 260, UI.surface, UI.outline);
  const type = S.pendingAd.type;
  const title = type === 'reduce' ? '观看广告降低分数线'
              : type === 'revive' ? '观看广告复活续命' : '观看广告获得道具';
  const sub = type === 'reduce' ? '本关分数线 -20%'
            : type === 'revive' ? '清掉半盘，分数保留' : ITEM_NAMES[S.pendingAd.item] + ' ×1';
  text(title, 76, 408, 22, UI.onSurface, '600');
  text(sub, 76, 452, 16, UI.onSurfaceVar);
  button(85, 520, 170, 56, 'filled', '观看广告', 17);
  button(285, 520, 170, 56, 'outlined', '取消', 17);
}
function drawGame() {
  drawHUD();
  panel(BX - 8, BY - 8, 476, 476, UI.surface, UI.outline);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const px = BX + x * (CELL + GAP), py = BY + y * (CELL + GAP);
    if (!inRegion(x, y, S.reg)) { drawLockedRock(px, py); continue; }
    cellSlot(px, py);
    const v = S.board[y][x];
    if (v >= 0) drawBoardCell(v, px, py, CELL);
  }
  for (let i = 0; i < 3; i++) itemButton(i, ITEM_X[i], ITEM_Y, ITEM_W, ITEM_H, S.items[i] > 0);
  text('选择方块，拖到棋盘', 34, 781, 14, UI.onSurfaceVar);
  S.pieces.forEach((p, i) => { if (!p.used) piece(p, 90 + i * 180, TRAY, 19); });
  if (S.drag >= 0) {
    const p = S.pieces[S.drag];
    if (inBoard(S.pos)) {
      const o = snapOrigin(p, S.pos);
      drawGhost(p, o.x, o.y, canPlace(p.cells, o.x, o.y));
    } else piece(p, S.pos.x, S.pos.y, 25);
  }
  text(S.msg, 34, 915, 14, UI.onSurfaceVar);
  if (S.result === 'win') drawWin();
  else if (S.result === 'lose') drawLose();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = UI.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  if (S.scene === 'menu') drawMenu();
  else if (S.scene === 'rank') drawRank();
  else if (S.scene === 'album') drawAlbum();
  else drawGame();
  drawAdDialog();
}

// ---------- 触控 ----------
function hit(x, y, x0, y0, w, h) { return x >= x0 && x <= x0 + w && y >= y0 && y <= y0 + h; }
wx.onTouchStart(e => {
  const t = toDesign(e.touches[0].clientX, e.touches[0].clientY);
  // 广告弹窗优先
  if (S.pendingAd) {
    if (hit(t.x, t.y, 85, 520, 170, 56)) {
      S.adUsed += 1; // 看完一次广告计数（模拟模式）
      if (S.pendingAd.type === 'item') {
        S.items[S.pendingAd.item] += 1;
        S.msg = '获得 ' + ITEM_NAMES[S.pendingAd.item] + ' ×1！(模拟广告)';
      } else if (S.pendingAd.type === 'reduce') reduceTargetAndRetry();
      else if (S.pendingAd.type === 'revive') reviveHalf();
    }
    S.pendingAd = null;
    draw(); return;
  }
  // 排行榜画面
  if (S.scene === 'rank') {
    if (hit(t.x, t.y, 160, 758, 220, 48)) { S.scene = 'menu'; draw(); }
    return;
  }
  // 图鉴画面：八篇分页 + 返回
  if (S.scene === 'album') {
    for (let p = 0; p < BEAD_PAGES.length; p++) {
      const tx = ALBUM_TAB.x0 + (p % ALBUM_TAB.cols) * (ALBUM_TAB.w + ALBUM_TAB.gap);
      const ty = ALBUM_TAB.y0 + Math.floor(p / ALBUM_TAB.cols) * (ALBUM_TAB.h + ALBUM_TAB.gap);
      if (hit(t.x, t.y, tx, ty, ALBUM_TAB.w, ALBUM_TAB.h)) { S.albumPage = p; break; }
    }
    if (hit(t.x, t.y, 160, 800, 220, 48)) { S.scene = 'menu'; }
    draw(); return;
  }
  // 主画面
  if (S.scene === 'menu') {
    if (hit(t.x, t.y, 32, 226, 476, 118)) startLevel(1);
    else if (hit(t.x, t.y, 32, 358, 476, 118)) startEndless();
    else if (hit(t.x, t.y, 40, 496, 218, 48)) showRank();
    else if (hit(t.x, t.y, 282, 496, 218, 48)) { S.scene = 'album'; }
    draw(); return;
  }
  // 过关画面
  if (S.result === 'win') {
    if (hit(t.x, t.y, 70, 545, 185, 52)) startLevel(S.level + 1);
    else if (hit(t.x, t.y, 285, 545, 185, 52)) toMenu();
    draw(); return;
  }
  // 死局画面
  if (S.result === 'lose') {
    if (S.mode === 'level') {
      if (hit(t.x, t.y, 48, 500, 138, 55)) retryLevel();
      else if (hit(t.x, t.y, 196, 500, 148, 55)) requestAd({ type: 'reduce' });
      else if (hit(t.x, t.y, 354, 500, 138, 55)) toMenu();
    } else {
      if (hit(t.x, t.y, 48, 500, 138, 55)) requestAd({ type: 'revive' });
      else if (hit(t.x, t.y, 196, 500, 148, 55)) startEndless();
      else if (hit(t.x, t.y, 354, 500, 138, 55)) toMenu();
    }
    draw(); return;
  }
  // 局内导航：重试 / 回主画面
  if (hit(t.x, t.y, 442, 18, 40, 40)) {
    if (S.mode === 'level') retryLevel(); else startEndless();
    draw(); return;
  }
  if (hit(t.x, t.y, 490, 18, 40, 40)) { toMenu(); draw(); return; }
  // 道具栏
  if (t.y >= ITEM_Y && t.y <= ITEM_Y + ITEM_H) {
    for (let i = 0; i < 3; i++) {
      if (hit(t.x, t.y, ITEM_X[i], ITEM_Y, ITEM_W, ITEM_H)) { useItem(i); break; }
    }
    draw(); return;
  }
  // 方块托盘
  if (t.y >= TRAY - 35 && t.y <= 925) {
    for (let i = 0; i < S.pieces.length; i++) {
      const p = S.pieces[i];
      if (!p.used && Math.abs(t.x - (90 + i * 180)) < 85) { S.drag = i; S.pos = t; break; }
    }
  }
  draw();
});
wx.onTouchMove(e => {
  if (S.drag < 0) return;
  S.pos = toDesign(e.touches[0].clientX, e.touches[0].clientY);
  draw();
});
wx.onTouchEnd(() => {
  if (S.drag < 0) return;
  const idx = S.drag, p = S.pieces[idx];
  S.drag = -1;
  if (inBoard(S.pos)) {
    const o = snapOrigin(p, S.pos);
    place(idx, o.x, o.y);
  } else S.msg = '把方块拖到棋盘上试试！';
  draw();
});

// ---------- 启动 ----------
loadSave();
S.scene = 'menu';
draw();
